name: Build and Release

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  check-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Restore Geodat Cache
        uses: actions/cache/restore@v5
        with:
          path: resources
          key: xray-geodat-

      - name: Ensure geoip/geosite assets
        run: |
          mkdir -p resources
          BASE='https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release'
          for FILE_NAME in geoip.dat geosite.dat; do
            if [ -s "./resources/${FILE_NAME}" ]; then
              echo "${FILE_NAME} exists."
            else
              echo "Downloading ${FILE_NAME}..."
              curl -fsSL -o "./resources/${FILE_NAME}" "${BASE}/${FILE_NAME}"
            fi
          done

      - name: Save Geodat Cache
        uses: actions/cache/save@v5
        with:
          path: resources
          key: xray-geodat-${{ github.run_id }}

  build:
    needs: check-assets
    permissions:
      contents: write
    strategy:
      # Linux only (VPS / server targets).
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: "386"
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: linux
            goarch: arm
            goarm: "6"
          - goos: linux
            goarch: arm
            goarm: "5"
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: loong64
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: s390x
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Show workflow information
        run: |
          _NAME=$(jq ".[\"$GOOS-$GOARCH$GOARM$GOMIPS\"].friendlyName" -r < .github/build/friendly-filenames.json)
          echo "GOOS: $GOOS, GOARCH: $GOARCH, GOARM: $GOARM, GOMIPS: $GOMIPS, RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Get project dependencies
        run: go mod download

      - name: Build Xray
        run: |
          mkdir -p build_assets
          COMMID=$(git describe --always --dirty)
          echo 'Building Xray for Linux...'
          if [[ ${GOARCH} == 'mips' || ${GOARCH} == 'mipsle' ]]; then
            go build -o build_assets/xray -trimpath -buildvcs=false -gcflags="-l=4" -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" -v ./main
            echo 'Building soft-float Xray for MIPS/MIPSLE 32-bit...'
            GOMIPS=softfloat go build -o build_assets/xray_softfloat -trimpath -buildvcs=false -gcflags="-l=4" -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" -v ./main
          else
            go build -o build_assets/xray -trimpath -buildvcs=false -gcflags="all=-l=4" -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" -v ./main
          fi

      - name: Restore Geodat Cache
        uses: actions/cache/restore@v5
        with:
          path: resources
          key: xray-geodat-

      - name: Add additional assets into package
        run: |
          mkdir -p resources
          BASE='https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release'
          for FILE_NAME in geoip.dat geosite.dat; do
            if [ ! -s "./resources/${FILE_NAME}" ]; then
              curl -fsSL -o "./resources/${FILE_NAME}" "${BASE}/${FILE_NAME}"
            fi
          done
          mv -f resources/geo* build_assets/

      - name: Copy README.md & LICENSE
        run: |
          cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md
          cp ${GITHUB_WORKSPACE}/LICENSE ./build_assets/LICENSE

      - name: Create ZIP archive
        if: github.event_name == 'release'
        shell: bash
        run: |
          pushd build_assets || exit 1
          touch -mt $(date +%Y01010000) *
          zip -9vr ../Xray-${{ env.ASSET_NAME }}.zip .
          popd || exit 1
          FILE=./Xray-${{ env.ASSET_NAME }}.zip
          DGST=$FILE.dgst
          for METHOD in {"md5","sha1","sha256","sha512"}
          do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$DGST
          done

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./Xray-${{ env.ASSET_NAME }}.zip*
          tag: ${{ github.ref }}
          file_glob: true

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Xray-${{ env.ASSET_NAME }}
          path: |
            ./build_assets/*
